[tool.poetry]
name = "cc-calculator"
version = "0.1.0"
description = "A country centrality calculator program"
authors = ["Felipe Gallois <fgallois@inf.ufrgs.br>"]
readme = "README.md"
packages = [{ include = "cc_calc", from = "src" }]
include = ["cc_calc/py.typed"]

[tool.poetry.dependencies]
python = "~3.14.2"
geoip2 = "^5.2.0"
networkx = "^3.6.1"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.14"
ty = "^0.0.14"
mypy = "^1.19.1"
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
types-networkx = "^3.6.1.20251220"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = ["D105"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"src/**/__init__.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
