[project]
name = "cc-calculator"
version = "0.1.0"
description = "A country centrality calculator program"
readme = "README.md"
requires-python = "~=3.14.2"

authors = [
  { name = "Felipe Gallois", email = "fgallois@inf.ufrgs.br" }
]

dependencies = [
  "geoip2>=5.2.0,<6",
  "networkx>=3.6.1,<4"
]

[dependency-groups]
dev = [
  "ruff>=0.14.14,<1",
  "ty>=0.0.14,<1",
  "mypy>=1.19.1,<2",
  "pytest>=9.0.2,<10",
  "pytest-mock>=3.15.1,<4",
  "pytest-cov>=7.0.0,<8",
  "types-networkx>=3.6.1.20251220,<4"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cc_calc"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["cc_calc"]
